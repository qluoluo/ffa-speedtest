[project]
name = "ffa-sample"
version = "0.1.0"
description = "FlashInfer integrated sparse attention with Triton sampling"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "triton>=2.1.0",
    "flashinfer",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ffa_sample*"]
